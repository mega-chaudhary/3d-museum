<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>usss character generator</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #1d1a1b; color: #f2ebe1; display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { padding: 22px; overflow: auto; border-right: 1px solid #3a3335; }
  h1 { font: 600 22px/1.2 Georgia, serif; margin: 0 0 6px; }
  p { color: #b9ada3; margin: 0 0 14px; }
  button { display: block; width: 100%; margin: 8px 0; padding: 11px 14px; border: 0; border-radius: 4px; background: #8e2436; color: #fff; font: 600 14px system-ui; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost { background: #3a3335; }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; color: #cfc4b8; background: #141112; padding: 10px; border-radius: 4px; min-height: 120px; }
  canvas { width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<aside>
  <h1>Character generator</h1>
  <p>Edit <code>characters.js</code> (hair, skin, clothes, face sliders, colours), then build. The two files you download replace <code>public/models/him.glb</code> and <code>her.glb</code> in the museum.</p>
  <button id="build">1. Build both characters</button>
  <button id="bake" disabled>2. Add animations</button>
  <button id="dlHim" class="ghost" disabled>Download him.glb</button>
  <button id="dlHer" class="ghost" disabled>Download her.glb</button>
  <div id="log">Ready.</div>
</aside>
<canvas id="c"></canvas>
<script type="module" src="/generate.js"></script>
</body>
</html>
